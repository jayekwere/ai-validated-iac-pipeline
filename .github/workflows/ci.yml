name: Independent verification
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - run: npm ci --ignore-scripts
      - run: python3 scripts/bootstrap.py
      - name: Verify live protected review boundaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_github_boundaries.py
      - run: npm run typecheck
      - run: npm run coverage
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: python3 scripts/check_workflows.py
      - run: npm audit --audit-level=moderate
      - run: python3 scripts/check_policy_coverage.py
      - run: .tools/opa test policy/v1 -v
      - run: npm run demo
      - run: node --experimental-strip-types scripts/adversarial.ts
      - run: python3 scripts/scan_repository.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verification-evidence
          path: evidence/
          retention-days: 14
  maintainer-approval:
    name: maintainer-approval
    needs: tests
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    environment: maintainer-approval
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record manual approval of this tested revision
        run: printf '%s\n' 'Maintainer approved this tested revision. No infrastructure was provisioned.'
